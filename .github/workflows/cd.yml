name: 🚀 CD — Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. SSH into EC2 and deploy ─────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP_DIR="/home/ubuntu/careerpilot_ai"
            BACKEND_DIR="$APP_DIR/backend"
            FRONTEND_DIR="$APP_DIR/frontend"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📥  Pulling latest code from git..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🐍  Installing backend dependencies..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd "$BACKEND_DIR"
            source venv/bin/activate
            pip install --upgrade pip --quiet
            pip install -r requirements.txt --quiet

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗄️   Running database migrations..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            alembic upgrade head

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚛️   Building frontend..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd "$FRONTEND_DIR"
            npm ci --silent
            npm run build

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📂  Copying frontend to Nginx..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sudo rm -rf /var/www/careerpilot/*
            sudo cp -r dist/* /var/www/careerpilot/

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄  Restarting services..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sudo systemctl restart careerpilot-backend
            sudo systemctl restart nginx

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅  Waiting for backend health check..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            for i in {1..30}; do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "✅ Backend is healthy!"
                break
              fi
              echo "   Waiting... ($i/30)"
              sleep 2
            done

            # Final check — fail the deploy if backend never came up
            curl -sf http://localhost:8000/health > /dev/null || \
              (echo "❌ Backend health check failed!" && exit 1)

            echo ""
            echo "🎉 Deploy complete!"
