name: 🚀 CD — Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -euo pipefail

            APP_DIR="/home/ubuntu/careerpilot_ai"
            BACKEND_DIR="$APP_DIR/backend"
            FRONTEND_DIR="$APP_DIR/frontend"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📥 Pulling latest code..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🛑 Stopping backend..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            sudo systemctl stop careerpilot-backend

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🐍 Installing backend dependencies..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd "$BACKEND_DIR"
            source venv/bin/activate

            pip install --upgrade pip --quiet
            pip install -r requirements.txt --quiet

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗄️ Running database migrations..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            alembic upgrade head

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚛️ Building frontend..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd "$FRONTEND_DIR"

            npm ci --silent
            npm run build

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📂 Deploying frontend..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            sudo rm -rf /var/www/careerpilot/*
            sudo cp -r dist/* /var/www/careerpilot/

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Starting backend..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            sudo systemctl start careerpilot-backend

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Reloading Nginx..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            sudo systemctl reload nginx

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Waiting for backend health..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Give systemd a moment to actually launch the process
            sleep 3

            HEALTHY=0
            # Wait up to 3 minutes (60 × 3s) — LangGraph's PostgreSQL checkpointer
            # setup can take 30-60s on a cold t3.micro
            for i in {1..60}; do
              STATUS=$(sudo systemctl is-active careerpilot-backend 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "failed" ]; then
                echo "❌ Backend service crashed! Showing logs:"
                sudo journalctl -u careerpilot-backend -n 50 --no-pager
                exit 1
              fi
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy! (took ~$((i * 3))s)"
                HEALTHY=1
                break
              fi
              echo "   Waiting... attempt $i/60 — service status: $STATUS"
              sleep 3
            done

            if [ "$HEALTHY" -eq 0 ]; then
              echo "❌ Backend did not become healthy within 3 minutes. Showing logs:"
              sudo journalctl -u careerpilot-backend -n 50 --no-pager
              exit 1
            fi

            echo ""
            echo "🎉 Deploy complete!"